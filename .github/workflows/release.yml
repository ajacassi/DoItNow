name: Release

# Two ways to trigger a release build:
#  1. Push a tag yourself (e.g. "v0.2.0") — builds immediately for that tag.
#  2. Push to master with a bumped MAJOR version in src-tauri/tauri.conf.json
#     (e.g. 1.4.2 -> 2.0.0) — the workflow notices, creates the "v2.0.0" tag
#     itself, and builds in the same run. Minor/patch bumps on master do NOT
#     auto-tag, so day-to-day pushes don't spam releases.
# Either way it ends with a draft GitHub Release with the Windows installer
# attached — review it and hit "Publish" when ready to distribute.
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
    paths:
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether to release
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "Triggered by a manually pushed tag: ${{ github.ref_name }}"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          MAJOR=$(echo "$VERSION" | cut -d. -f1)

          git fetch --tags
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)

          if [[ -z "$LATEST_TAG" ]]; then
            LATEST_MAJOR=-1
          else
            LATEST_MAJOR=$(echo "${LATEST_TAG#v}" | cut -d. -f1)
          fi

          echo "Current version: $VERSION (major $MAJOR) — latest tag: ${LATEST_TAG:-none} (major $LATEST_MAJOR)"

          if [[ "$MAJOR" -gt "$LATEST_MAJOR" ]]; then
            NEW_TAG="v${VERSION}"
            echo "Major version bump detected — tagging $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "No major version bump — nothing to release."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    needs: determine-tag
    if: needs.determine-tag.outputs.proceed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.determine-tag.outputs.tag }}
          releaseName: "DoItNow ${{ needs.determine-tag.outputs.tag }}"
          releaseDraft: true
          prerelease: false
